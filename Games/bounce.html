      // for the false-wall case lives in resolveSlopes' fallback-match depth
      // instead (see findSlopeForFoot / MAX_SNAP_DEPTH), not here.
      //
      // FLOOR ramps only. Every "invisible wall/platform" bug reported
      // across this whole feature (water+ceiling bobbing, the flat-to-ramp
      // false wall, this one) has traced back to a CEILING-role slope
      // specifically — walking off flat ground directly onto one leaves the
      // ball's y stale (still wherever the flat tile put it, not yet
      // corrected by resolveSlopes, which runs after this check) often
      // enough that a real fix isn't a targeted patch, it's just not
      // running this check against ceiling slopes at all. They're still
      // fully solid vertically (resolveSlopes' "ceil" role, and the
      // separate jump-into-the-underside block, are untouched) — this only
      // removes the horizontal side-on wall check for them. Floor ramps
      // (pyramids, staircases) keep the full check, unchanged.
      const enterCol = ball.vx < 0 ? Math.floor((newX - half) / TILE) : Math.floor((newX + half - 1) / TILE);
      const top = Math.floor((ball.y - half) / TILE);
      const bottom = Math.floor((ball.y + half - 1) / TILE);
      for (let row = top; row <= bottom; row++) {
        const def = slopeDefAt(enterCol, row);
        if (!def || def.type !== "slopeFloor") continue;
        let sx, sy, offset;
        switch (def.transform) {
          case "id":     sx = 1;  sy = 1;  offset = TILE;  break;
          case "flipX":  sx = -1; sy = 1;  offset = 0;     break;
          case "flipY":  sx = 1;  sy = -1; offset = 0;     break;
          case "rot180": sx = -1; sy = -1; offset = -TILE; break;
          default: continue;
        }
        const lx = newX - enterCol * TILE, ly = ball.y - row * TILE;
        const signedD = (sx * lx + sy * ly - offset) / Math.SQRT2; // > 0 = solid side
        if (signedD > 1.5) {
          lastHorizBlockDebug = { kind: "diagonal", col: enterCol, row, transform: def.transform, signedD: signedD.toFixed(1) };
          newX = ball.vx < 0 ? (enterCol + 1) * TILE + half + 0.01 : enterCol * TILE - half - 0.01;
          ball.vx = 0;
          break;
        }
      }
    }
    // (No separate slope pre-check here: physicsSubstep already runs in small,
    // speed-capped increments — see step()'s substep loop — and resolveSlopes
    // snaps the ball onto the ramp right below every substep, so it can't
    // outrun or tunnel through a slope. An earlier version blocked horizontal
    // movement whenever the OLD foot height was a hair below the NEW tile's
    // slope surface — which deadlocked the ball at slope-to-slope transitions
    // like a pyramid peak, since resolveSlopes never got a chance to lift it
    // first.)
    ball.x = newX;
    ball.rollAngle += (ball.vx * dt) / (ball.size / 2);

    // --- vertical / gravity ---
    if (ball.grounded) {
      // Resting: don't re-run gravity/collision every frame (that was causing
      // the endless "bounce" sound and swallowing jump presses while still).
      // Keep groundBouncy in sync with whatever flat tile is actually
      // underneath — walking from flat ground onto a bouncy tile (or off
      // it) while never leaving the ground doesn't fire a "landing" event,
      // so it has to be refreshed here too, not just on actual landings.
      const support = boxCollides(ball.x, ball.y + gSign * 1.5);
      if (support) ball.groundBouncy = !!(support.def && support.def.bouncy);
      // Hoop rim, hazard, and inflater are solid via a small thin rect
      // (pushBallOutOfRect), not a normal SOLID_TYPES tile, so the
      // boxCollides check above never finds them — `support` was always
      // null while resting on one, which set grounded back to false EVERY
      // substep jump wasn't currently held (it only ever survived because
      // resolveHoopSolids/resolveThinSolids caught it again moments later,
      // same substep) — a flicker that made jump presses unreliable to
      // land. Treat those surfaces as supported too so grounded actually
      // stays put while genuinely resting on one.
      const stillSupported = support || hasThinRectGround(gSign);
      // Bouncy ground auto-relaunches every frame jump is HELD (chain keeps
      // climbing); normal ground still needs a fresh press each time.
      if (ball.groundBouncy ? input.up : upJustPressedEdge) {
        launchJump(gSign);
      } else {
        ball.vy = 0;
        if (ball.groundBouncy) ball.bounceChain = 0; // let go — power resets
        // still supported? (e.g. the ground tile could've been cleared) — if not, start falling again
        if (!stillSupported) ball.grounded = false;
      }
    } else {
      // Water swaps in buoyancy instead of normal gravity: a steady net
      // upward pull for the big ball (still lets it dive in and sink a bit
      // first — falling out naturally from applying this per-substep rather
      // than needing a special "just entered water" event), or just a
      // slower fall for the small ball, matching "big balls float, small
      // balls sink".
      let gravity, maxFall, maxRise = null;
      const isBig = ball.size === BALL_SIZE_BIG;
      if (ball.inWater && isBig) {
        gravity = -WATER_FLOAT_ACCEL_BIG;
        maxFall = WATER_MAX_DIVE_BIG; // still cap an initial fast dive-in, but gentler than normal air fall
        maxRise = WATER_MAX_RISE_BIG;
      } else if (ball.inWater) {
        gravity = GRAVITY_SMALL * WATER_SINK_GRAVITY_SCALE_SMALL;
        maxFall = WATER_MAX_SINK_SMALL;
      } else {
        gravity = isBig ? GRAVITY_BIG : GRAVITY_SMALL;
        maxFall = isBig ? MAX_FALL_BIG : MAX_FALL_SMALL;
      }
      // Resting against a ceiling slope (e.g. a big ball floating up into
      // the underside of one) used to get fought every single substep:
      // buoyancy pushes up, the ceiling snaps it back down and zeroes vy,
      // then buoyancy immediately pushes up again next substep — a rapid
      // bob that also made it hard to just slide out sideways, since the
      // ball never got a quiet moment to actually drift. If a force would
      // push further INTO a ceiling it's already settled against, skip
      // that increment instead — same idea as `grounded` already skipping
      // gravity entirely once settled on a floor.
      if (!(wasCeilinged && gravity * gSign < 0)) {
        ball.vy += gravity * gSign * dt;
      }
      // only cap speed while actually falling (moving WITH gravity) — a jump
      // impulse against gravity should never be clipped by the fall-speed cap
      if (ball.vy * gSign > maxFall) ball.vy = maxFall * gSign;
      if (maxRise !== null && ball.vy * gSign < -maxRise) ball.vy = -maxRise * gSign;

      let newY = ball.y + ball.vy * dt;
      // Ramp tiles look solid but are excluded from boxCollides entirely
      // (resolveSlopes handles riding them from the correct side instead),
      // which left nothing stopping the ball moving UP through the
      // underside of a FLOOR ramp — jump into the open space below one and
      // you'd sail straight through its wedge and land on top from behind.
      // Block just that one case here — bounced with the same damping as a
      // normal ceiling hit below, not a hard stop. Deliberately checks for
      // slopeFloor specifically, not any slope: a CEILING slope approached
      // from below while moving up is the normal, correct way to hit it —
      // resolveSlopes' diagonal "ceil" handling already covers that
      // properly, and this used to also match slopeCeil, blocking the
      // whole tile as a flat wall (ignoring the actual diagonal shape)
      // before resolveSlopes ever got a chance to run.
      if (ball.vy * gSign < 0) {
        const half = ball.size / 2;
        const edgeY = ball.vy < 0 ? newY - half : newY + half;
        const slopeRow = Math.floor(edgeY / TILE);
        const left = Math.floor((ball.x - half) / TILE);
        const right = Math.floor((ball.x + half - 1) / TILE);
        for (let c = left; c <= right; c++) {
          const slope = slopeDefAt(c, slopeRow);
          if (slope && slope.type === "slopeFloor") {
            newY = ball.vy < 0 ? (slopeRow + 1) * TILE + half + 0.01 : slopeRow * TILE - half - 0.01;
            ball.vy = -ball.vy * BOUNCE_DAMPING;
            if (Math.abs(ball.vy) < REST_VEL) ball.vy = 0;
            break;
          }
        }
      }
      const hitY = boxCollides(ball.x, newY);
      if (hitY) {
        const movingWithGravity = (ball.vy * gSign) > 0;
        const isBouncy = !!(hitY.def && hitY.def.bouncy);
        if (ball.vy > 0) newY = hitY.row * TILE - ball.size / 2 - 0.01;
        else if (ball.vy < 0) newY = (hitY.row + 1) * TILE + ball.size / 2 + 0.01;
        const wasFalling = Math.abs(ball.vy) > REST_VEL;
        // Bouncy ground behaves like normal ground on contact — it only
        // relaunches (with an escalating, uncapped boost) while jump is HELD
        // through the landing; letting go just settles and resets the chain.
        const shouldLaunch = movingWithGravity && (isBouncy ? input.up : (upJustPressedEdge || (wasFalling && input.up)));
        if (shouldLaunch) {
          ball.groundBouncy = isBouncy;
          launchJump(gSign);
        } else {
          ball.vy = -ball.vy * BOUNCE_DAMPING;
          if (Math.abs(ball.vy) < REST_VEL) {
            ball.vy = 0;
            if (movingWithGravity) {
              ball.grounded = true;
              ball.groundBouncy = isBouncy;
              ball.bounceChain = 0; // settled without holding — power resets
            } else {
              // Ceiling hit settling, same idea as grounded above but
              // upward — without this, buoyancy (or any upward force) kept
              // re-fighting a perfectly flat, solid ceiling every substep
              // forever, since NOTHING here ever marked that as "settled."
              // resolveSlopes' slope-ceiling branch already had this; plain
              // box-collision ceilings never did.
              ball.ceilinged = true;
            }
          }
          if (wasFalling && !isBouncy) play("bounce");
        }
      }
      ball.y = newY;
    }
    circleTileCornerFix();
    resolveSlopes(gSign);
    resolveHoopSolids(gSign);
    resolveThinSolids(gSign);
  }

  // Shared circle-vs-rect push-out, used for anything that's solid across a
  // smaller rect than a full tile (hoop rim walls, hazard/inflater sprite
  // shapes). `standable` controls whether resting on TOP of this rect
  // counts as grounded ground — hazards/inflaters do, the hoop rim does
  // too, but callers can pass false to opt out (nothing currently does).
  function pushBallOutOfRect(rect, gSign, standable) {
    const radius = ball.size / 2;
    const nearX = Math.max(rect.x0, Math.min(ball.x, rect.x1));
    const nearY = Math.max(rect.y0, Math.min(ball.y, rect.y1));
    const dx = ball.x - nearX, dy = ball.y - nearY;
    const distSq = dx * dx + dy * dy;
    if (distSq >= radius * radius) return;
    let nx, ny, targetX = null, targetY = null;
    const dist = Math.sqrt(distSq);
    if (dist < 1e-4) {
      // center landed exactly inside the rect (fast-moving overlap) — push
      // out whichever direction is shortest
      const left = ball.x - rect.x0, right = rect.x1 - ball.x;
      const top = ball.y - rect.y0, bottom = rect.y1 - ball.y;
      const min = Math.min(left, right, top, bottom);
      if (min === left) { targetX = rect.x0 - radius; nx = -1; ny = 0; }
      else if (min === right) { targetX = rect.x1 + radius; nx = 1; ny = 0; }
      else if (min === top) { targetY = rect.y0 - radius; nx = 0; ny = -1; }
      else { targetY = rect.y1 + radius; nx = 0; ny = 1; }
    } else {
      nx = dx / dist; ny = dy / dist;
    }
    const vAlongN = ball.vx * nx + ball.vy * ny;
    // Bug: this used to always reposition the ball back out to exactly
    // `radius` away, every single substep, with no regard for which way it
    // was already moving. That's correct for a ball genuinely resting or
    // pressing INTO the rect — but a ball that just launched a jump while
    // centered on a thin rect (e.g. dead on a horizontal hoop's rim seam)
    // is already moving AWAY along the normal that same substep, and while
    // its own per-substep travel is still smaller than the rect's overlap
    // zone, it kept getting *additionally* shoved outward here on top of
    // its own velocity — several substeps' worth of free extra push stacked
    // on top of the jump before it finally cleared the rect, landing
    // however many extra px higher depending on exactly how many substeps
    // that overlap happened to last (which is why it only sometimes ran
    // high — purely a matter of pixel-perfect timing/alignment). Skip the
    // reposition (but still shed inward velocity below, same as always)
    // once it's clearly departing rather than resting or pressing in.
    const departing = vAlongN > 5;
    if (!departing) {
      if (targetX !== null) ball.x = targetX;
      else if (targetY !== null) ball.y = targetY;
      else {
        const push = radius - dist;
        ball.x += nx * push;
        ball.y += ny * push;
      }
    }
    if (vAlongN < 0) { // still driving into it — shed just that component
      ball.vx -= vAlongN * nx;
      ball.vy -= vAlongN * ny;
    }
    // Landed on top, in the gravity sense — stand on it like normal ground.
    // Guarded the same way as resolveSlopes: only when not actively moving
    // away (e.g. a jump launched this same substep), or this would silently
    // cancel that jump next substep.
    if (standable && ny * gSign < -0.5 && ball.vy * gSign >= 0) {
      ball.grounded = true;
      ball.groundBouncy = false;
      ball.bounceChain = 0;
    }
  }

  // Hoop tiles are otherwise fully passable (not in SOLID_TYPES) — fly
  // straight through from any direction. This adds back a small genuinely
  // SOLID block per part (blocks from every side, not a one-way platform)
  // near the tile's outer edge (away from the hole) so you can still stand
  // on it. Deliberately kept SMALL and SHORT rather than the wide/tall box
  // from earlier: a small ball is 14px and the tile is only 16px, so
  // there's nowhere near enough room to also carve out a side gap the ball
  // could squeeze past through — trying that just walls off the whole tile
  // instead. Keeping the block small/low means a ball rolling by just bumps
  // up and over it (or past its sides) like a little curb, rather than
  // hitting a wall. The bottom part of a vertical hoop gets nothing —
  // that's the hole — and this whole rim box is skipped for a small hoop
  // while the ball is big, since that case uses BIG_BALL_SMALL_HOOP_RECT
  // instead (below).
  function hoopSolidRectAt(part, col, row) {
    const x0 = col * TILE, y0 = row * TILE;
    switch (part) {
      case "top":   return { x0: x0 + TILE * 0.275,  y0: y0,                x1: x0 + TILE * 0.725,  y1: y0 + TILE * 0.25 };
      case "left":  return { x0: x0,                 y0: y0 + TILE * 0.3125, x1: x0 + TILE * 0.25,   y1: y0 + TILE * 0.6875 };
      case "right": return { x0: x0 + TILE * 0.75,   y0: y0 + TILE * 0.3125, x1: x0 + TILE,           y1: y0 + TILE * 0.6875 };
      default: return null; // "bottom" — the hole, no collision at all
    }
  }
  // A big ball can't fit through a small hoop, but the block for that
  // shouldn't be the full 16x16 tile square either — this uses the actual
  // composited sprite's bounding box per part (measured the same way as
  // the hazard/inflater rects: rendering the real translate/scale/rotate
  // canvas ops and reading back the alpha) so it's thin and shaped like the
  // tube, not a fat square. Every part is solid here (including "bottom" —
  // unlike the normal small-ball rim, the WHOLE hoop is too tight for a big
  // ball, not just its rim), but a horizontal part (left/right) still isn't
  // standable — it blocks like a wall, but was never meant to be footing.
  const BIG_BALL_SMALL_HOOP_RECT = {
    top:    { x0: 0.25,  y0: 0.167, x1: 0.75,  y1: 1 },
    bottom: { x0: 0.25,  y0: 0,     x1: 0.75,  y1: 0.833 },
    left:   { x0: 0.167, y0: 0.25,  x1: 1,     y1: 0.75 },
    right:  { x0: 0,     y0: 0.25,  x1: 0.833, y1: 0.75 },
  };
  function resolveHoopSolids(gSign) {
    if (cheat.enabled && cheat.noclip) return;
    forEachOverlappedTile(ball.x, ball.y, (col, row) => {
      const def = classifyTile(tileIdAt(col, row));
      if (def.type !== "hoop") return;
      if (!def.big && ball.size === BALL_SIZE_BIG) {
        const r = BIG_BALL_SMALL_HOOP_RECT[def.part];
        const rect = {
          x0: col * TILE + r.x0 * TILE, y0: row * TILE + r.y0 * TILE,
          x1: col * TILE + r.x1 * TILE, y1: row * TILE + r.y1 * TILE,
        };
        const standable = def.part !== "left" && def.part !== "right";
        pushBallOutOfRect(rect, gSign, standable);
        return;
      }
      const rect = hoopSolidRectAt(def.part, col, row);
      if (!rect) return;
      pushBallOutOfRect(rect, gSign, true);
    });
  }

  // Hazard (candle) and inflater are both solid, but only across the actual
  // drawn shape — a slim vertical (or, rotated, horizontal) strip — not the
  // full tile. Base rects measured directly from the sprite art's alpha
  // channel at its default (unrotated) facing; ROTATION_BY_ID's rotation is
  // then applied to the rect itself so a sideways hazard's hitbox rotates
  // right along with its sprite.
  const THIN_SOLID_BASE_RECT = {
    hazard:   { x0: 0.25,  y0: 0, x1: 0.667, y1: 1 },
    inflater: { x0: 0.333, y0: 0, x1: 0.75,  y1: 1 },
  };
  function rotateRectFraction(r, deg) {
    switch (((deg % 360) + 360) % 360) {
      case 90:  return { x0: r.y0, y0: 1 - r.x1, x1: r.y1, y1: 1 - r.x0 };
      case 180: return { x0: 1 - r.x1, y0: 1 - r.y1, x1: 1 - r.x0, y1: 1 - r.y0 };
      case 270: return { x0: 1 - r.y1, y0: r.x0, x1: 1 - r.y0, y1: r.x1 };
      default:  return r;
    }
  }
  function resolveThinSolids(gSign) {
    if (cheat.enabled && cheat.noclip) return;
    forEachOverlappedTile(ball.x, ball.y, (col, row) => {
      const def = classifyTile(tileIdAt(col, row));
      const base = THIN_SOLID_BASE_RECT[def.type];
      if (!base) return;
      const r = rotateRectFraction(base, def.rotation || 0);
      const rect = {
        x0: col * TILE + r.x0 * TILE, y0: row * TILE + r.y0 * TILE,
        x1: col * TILE + r.x1 * TILE, y1: row * TILE + r.y1 * TILE,
      };
      pushBallOutOfRect(rect, gSign, true);
    });
  }

  // The ball is round, but the horizontal/vertical box collision above
  // treats it as a square — fine for hitting a face head-on, but a real
  // circle grazing the CORNER of a small platform (like bouncing near the
  // edge of a short floating block) should just glance off, not catch.
  // The square hitbox can catch that corner on one axis while the ball is
  // still trying to settle on the other, repeatedly zeroing horizontal
  // speed each time — killing all momentum before it even lands. This only
  // touches full solid/bouncy tiles (never ramps — resolveSlopes owns
  // those) and only nudges the ball when its actual circular body is
  // overlapping a tile's corner region, which normal face-on hits never
  // reach (a flush face contact sits exactly `radius` away from the
  // nearest point, never inside it), so it can't interfere with regular
  // collision.
  function circleTileCornerFix() {
    if (cheat.enabled && cheat.noclip) return;
    const radius = ball.size / 2;
    forEachOverlappedTile(ball.x, ball.y, (col, row) => {
      const def = classifyTile(tileIdAt(col, row));
      if (!isSolidTile(def)) return;
      const left = col * TILE, top = row * TILE;
      const nearX = Math.max(left, Math.min(ball.x, left + TILE));
      const nearY = Math.max(top, Math.min(ball.y, top + TILE));
      const dx = ball.x - nearX, dy = ball.y - nearY;
      const distSq = dx * dx + dy * dy;
      if (distSq >= radius * radius) return;
      const dist = Math.sqrt(distSq);
      if (dist < 1e-4) return; // dead-center overlap — let the axis collision handle it
      const nx = dx / dist, ny = dy / dist;
      const push = radius - dist;
      ball.x += nx * push;
      ball.y += ny * push;
      const vAlongN = ball.vx * nx + ball.vy * ny;
      if (vAlongN < 0) { // still driving into the corner — shed just that component
        ball.vx -= vAlongN * nx;
        ball.vy -= vAlongN * ny;
      }
    });
  }

  function step(dt) {
    if (game.mode !== "playing") return;

    if (ball.state === "popped") {
      ball.popTimer -= dt;
      if (ball.popTimer <= 0) {
        if (game.lives < 0) {
          game.mode = "gameover";
          play("gameover");
        } else {
          resetBall();
        }
      }
      return;
    }

    const FREE_ROAM_SPEED = 260; // px/sec

    if (cheat.enabled && cheat.noclip) {
      // free roam: direct flight in all 4 directions, no gravity, no collision
      let vx = 0, vy = 0;
      if (input.left && !input.right) vx = -FREE_ROAM_SPEED;
      else if (input.right && !input.left) vx = FREE_ROAM_SPEED;
      if (input.up && !input.down) vy = -FREE_ROAM_SPEED;
      else if (input.down && !input.up) vy = FREE_ROAM_SPEED;
      ball.vx = vx;
      ball.vy = vy;
      ball.x += vx * dt;
      ball.y += vy * dt;
      ball.grounded = false;
      // keep the ball roughly inside the level so the camera doesn't run away forever
      ball.x = Math.max(0, Math.min(level.width * TILE, ball.x));
      ball.y = Math.max(0, Math.min(level.height * TILE, ball.y));
      ball.rollAngle += (ball.vx * dt) / (ball.size / 2);
      upHeldPrev = input.up;
    } else {
      // Fast movement (from a big escalating bounce, or just a fast fall) can
      // otherwise skip clean over a thin diagonal slope — or even a solid
      // tile — within a single frame, since collision is only checked at the
      // destination point. Split the frame into smaller substeps so nothing
      // moves more than a fraction of a tile between collision checks.
      const speed = Math.max(Math.abs(ball.vx), Math.abs(ball.vy), 1);
      const maxStepDist = TILE * 0.4;
      const steps = Math.min(16, Math.max(1, Math.ceil((speed * dt) / maxStepDist)));
      const subDt = dt / steps;
      const upJustPressedThisFrame = input.up && !upHeldPrev;
      for (let i = 0; i < steps; i++) {
        physicsSubstep(subDt, i === 0 && upJustPressedThisFrame);
      }
      upHeldPrev = input.up;

      if (ball.jumpBoostTimer > 0) {
        ball.jumpBoostTimer -= dt;
        if (ball.jumpBoostTimer < 0) ball.jumpBoostTimer = 0;
      }
      if (ball.speedBoostTimer > 0) {
        ball.speedBoostTimer -= dt;
        if (ball.speedBoostTimer < 0) ball.speedBoostTimer = 0;
      }
    }

    // --- hazards kill on contact — checked against the SAME thin rotated
    // rect used for its actual solid collision (resolveThinSolids), not a
    // padded full-tile check, so the kill zone matches what you can see
    // and what you visibly bump into, not the tile's whole square. A small
    // pad is still needed here though: resolveThinSolids pushes the ball
    // to rest exactly `radius` away (flush, not overlapping) once it's
    // settled against it, so a strict "< radius" test stops seeing contact
    // the moment it's done pushing — meaning standing on top or resting
    // against its side would silently stop killing you. Same class of bug
    // as the padded solid-trigger tiles elsewhere (see forEachNearTile).
    const HAZARD_TOUCH_PAD = 1.5;
    forEachNearTile(ball.x, ball.y, HAZARD_TOUCH_PAD, (c, r) => {
      if (isExitTile(c, r)) return;
      const def = classifyTile(tileIdAt(c, r));
      if (def.type !== "hazard") return;
      const rect = rotateRectFraction(THIN_SOLID_BASE_RECT.hazard, def.rotation || 0);
      const x0 = c * TILE + rect.x0 * TILE, y0 = r * TILE + rect.y0 * TILE;
      const x1 = c * TILE + rect.x1 * TILE, y1 = r * TILE + rect.y1 * TILE;
      const nearX = Math.max(x0, Math.min(ball.x, x1));
      const nearY = Math.max(y0, Math.min(ball.y, y1));
      const dx = ball.x - nearX, dy = ball.y - nearY;
      const reach = ball.size / 2 + HAZARD_TOUCH_PAD;
      if (dx * dx + dy * dy < reach * reach) killBall();
    });

    // --- moving spikes: update positions, then AABB-check against the ball ---
    updateSpikes(level, dt);
    if (ball.state === "alive") {
      const bLeft = ball.x - ball.size / 2, bRight = ball.x + ball.size / 2;
      const bTop = ball.y - ball.size / 2, bBottom = ball.y + ball.size / 2;
      for (const s of level.spikes) {
        const sLeft = s.curCol * TILE, sTop = s.curRow * TILE;
        const sRight = sLeft + s.w * TILE, sBottom = sTop + s.h * TILE;
        if (bLeft < sRight && bRight > sLeft && bTop < sBottom && bBottom > sTop) {
          killBall();
          break;
        }
      }
    }

    // --- triggers (life / checkpoint / antigravity / hoops / goal) ---
    const goal = collectTriggers();
    if (goal && ball.state === "alive") {
      game.score += 500;
      play("goal");
      game.mode = "levelcomplete";
      markLevelComplete(game.levelIndex);
    }

    // --- camera follows the ball, clamped to level bounds ---
    const viewW = VIEW_COLS * TILE, viewH = VIEW_ROWS * TILE;
    const levelW = level.width * TILE, levelH = level.height * TILE;
    camera.x = Math.max(0, Math.min(levelW - viewW, ball.x - viewW / 2));
    camera.y = Math.max(0, Math.min(levelH - viewH, ball.y - viewH / 2));
    if (levelW <= viewW) camera.x = -(viewW - levelW) / 2;
    if (levelH <= viewH) camera.y = -(viewH - levelH) / 2;
    // round to whole pixels — a fractional camera offset was sub-pixel-shifting
    // every tile draw each frame, which showed up as hairline seams (most
    // visible on thin sprites like the hoops)
    camera.x = Math.round(camera.x);
    camera.y = Math.round(camera.y);
  }

  // ---- rendering -----------------------------------------------
  function drawSprite(name, dx, dy, dw, dh, rotationDeg, transform) {
    if (name === "big_spike") {
      if (!rotationDeg && !transform) {
        ctx.drawImage(bigSpikeImg, 0, 0, bigSpikeImg.width, bigSpikeImg.height, dx, dy, dw, dh);
        return true;
      }
      ctx.save();
      ctx.translate(dx + dw / 2, dy + dh / 2);
      if (transform === "flipX") ctx.scale(-1, 1);
      else if (transform === "flipY") ctx.scale(1, -1);
      else if (transform === "rot180") ctx.rotate(Math.PI);
      if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
      ctx.drawImage(bigSpikeImg, 0, 0, bigSpikeImg.width, bigSpikeImg.height, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
      return true;
    }
    const idx = SPRITE_SLOT[name];
    if (idx === undefined) return false;
    if (!rotationDeg && !transform) {
      ctx.drawImage(tilesetImg, idx * 12, 0, 12, 12, dx, dy, dw, dh);
      return true;
    }
    ctx.save();
    ctx.translate(dx + dw / 2, dy + dh / 2);
    if (transform === "flipX") ctx.scale(-1, 1);
    else if (transform === "flipY") ctx.scale(1, -1);
    else if (transform === "rot180") ctx.rotate(Math.PI);
    if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
    ctx.drawImage(tilesetImg, idx * 12, 0, 12, 12, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
    return true;
  }

  function drawHoopTile(def, dx, dy, col, row, passed) {
    const set = def.big ? hoopImgs.big : hoopImgs.small;
    const img = passed ? set.used : set.active;
    const drawOne = (flipX, flipY, rotationDeg) => {
      ctx.save();
      ctx.translate(dx + TILE / 2, dy + TILE / 2);
      ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
      if (rotationDeg) ctx.rotate((rotationDeg * Math.PI) / 180);
      ctx.drawImage(img, -TILE / 2, -TILE / 2, TILE, TILE);
      ctx.restore();
    };
    if (def.part === "left" || def.part === "right") {
      // mirrored top-to-bottom onto itself so each tile is its own symmetric
      // "(" / ")" half, which then line up side by side into one ring.
      const flipX = def.part === "right";
      drawOne(flipX, false, 0);
      drawOne(flipX, true, 0);
      return;
    }
    // vertical hoop: bottom piece's rotation is used for the TOP tile and
    // vice versa; each is mirrored left-to-right onto itself so each tile is
    // its own symmetric cap/cup, stacking into one ring.
    const rotationDeg = def.part === "top" ? 90 : -90;
    drawOne(false, false, rotationDeg);
    drawOne(true, false, rotationDeg);
  }

  const WATER_COLOR = "#0C60B0";

  function drawTileCell(id, col, row) {
    const dx = col * TILE - camera.x, dy = row * TILE - camera.y;
    const def = classifyTile(id);
    // Water is a solid backing color, not a translucent overlay — any
    // waterlogged tile (hazard, slope, hoop, ...) draws its normal sprite
    // on TOP of this same fill, same as plain open water just draws the
    // fill with nothing on top.
    if (def.type === "water" || def.water) {
      ctx.fillStyle = WATER_COLOR;
      ctx.fillRect(dx, dy, TILE, TILE);
    }
    switch (def.type) {
      case "air": return;
      case "water": return; // fill above is the entire tile
      case "hoop": {
        const passed = passedHoopKeys.has(hoopPairKey(def.part, row, col));
        drawHoopTile(def, dx, dy, col, row, passed);
        return;
      }
      case "checkpoint": {
        const key = row + "," + col;
        if (key === activeCheckpointKey) {
          ctx.drawImage(checkpointActiveImg, 0, 0, 12, 12, dx, dy, TILE, TILE);
        } else if (!usedCheckpoints.has(key)) {
          drawSprite("checkpoint", dx, dy, TILE, TILE);
        } // else: an older, superseded checkpoint — stays gone for good
        return;
      }
      default:
        if (def.sprite) {
          drawSprite(def.sprite, dx, dy, TILE, TILE, def.rotation, def.transform);
        } else if (def.unknown) {
          ctx.fillStyle = "rgba(210, 30, 180, 0.5)";
          ctx.fillRect(dx, dy, TILE, TILE);
          ctx.strokeStyle = "#ff00d0";
          ctx.strokeRect(dx + 1, dy + 1, TILE - 2, TILE - 2);
        }
    }
  }

  function drawBackground() {
    ctx.fillStyle = "#a2d3e3";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawLevel() {
    const c0 = Math.max(0, Math.floor(camera.x / TILE));
    const c1 = Math.min(level.width - 1, Math.ceil((camera.x + canvas.width) / TILE));
    const r0 = Math.max(0, Math.floor(camera.y / TILE));
    const r1 = Math.min(level.height - 1, Math.ceil((camera.y + canvas.height) / TILE));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        drawTileCell(level.tiles[r][c], c, r);
      }
    }
    // exit overlay: a 2x2 object, distinct textures for locked vs. unlocked
    const ex = level.exit.x * TILE - camera.x, ey = level.exit.y * TILE - camera.y;
    if (exitLocked()) {
      ctx.drawImage(goalLockedImg, 0, 0, 24, 24, ex, ey, TILE * 2, TILE * 2);
    } else {
      ctx.drawImage(goalOpenImg, 0, 0, 12, 12, ex, ey, TILE * 2, TILE * 2);
    }
  }

  function drawSpikes() {
    if (!level.spikes) return;
    for (const s of level.spikes) {
      const dx = s.curCol * TILE - camera.x, dy = s.curRow * TILE - camera.y;
      const dw = s.w * TILE, dh = s.h * TILE;
      // cull off-screen
      if (dx + dw < 0 || dy + dh < 0 || dx > canvas.width || dy > canvas.height) continue;
      drawSprite("big_spike", dx, dy, dw, dh);
    }
  }

  function drawBall() {
    const sx = ball.x - camera.x, sy = ball.y - camera.y;
    // Sprite must track the ball's CURRENT size, not the level's starting
    // size — inflater/deflater change ball.size at runtime without ever
    // touching level.bigBall (that's only ever used for respawn size).
    const isBig = ball.size === BALL_SIZE_BIG;
    const img = isBig ? bigBallImg : ballImg;
    if (ball.state === "popped") {
      const t = 1 - Math.max(0, ball.popTimer / RESPAWN_DELAY); // 0 -> 1 across the pop duration
      const scale = 1 + t * 0.7;
      ctx.save();
      ctx.globalAlpha = t > 0.7 ? Math.max(0, 1 - (t - 0.7) / 0.3) : 1;
      ctx.translate(sx, sy);
      ctx.scale(scale, scale);
      ctx.drawImage(popImg, -ball.size / 2, -ball.size / 2, ball.size, ball.size);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(sx, sy);
    if (ball.gravityFlipped) ctx.scale(1, -1);
    ctx.rotate(ball.rollAngle);
    // big_ball.png has transparent padding around the circle (16x16 content
    // inside a 24x24 canvas); crop to content so the sprite fills the hitbox.
    if (isBig) {
      ctx.drawImage(img, 4, 4, 16, 16, -ball.size / 2, -ball.size / 2, ball.size, ball.size);
    } else {
      ctx.drawImage(img, -ball.size / 2, -ball.size / 2, ball.size, ball.size);
    }
    ctx.restore();
  }

  function drawCenteredPanel(lines) {
    ctx.fillStyle = "rgba(10, 20, 12, 0.78)";
    ctx.fillRect(0, canvas.height / 2 - 34, canvas.width, 68);
    ctx.fillStyle = "#eef7ee";
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "center";
    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, canvas.height / 2 - 12 + i * 16);
    });
    ctx.textAlign = "left";
  }

  function drawMenu() {
    canvas.width = 320;
    canvas.height = 236;
    ctx.fillStyle = "#0a1f0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (splashImg.complete && splashImg.naturalWidth) {
      const s = 132;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(splashImg, (canvas.width - s) / 2, 12, s, s);
    }
    ctx.fillStyle = "#eef7ee";
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("B O U N C E", canvas.width / 2, 176);
    ctx.font = "11px 'Courier New', monospace";
    ctx.fillStyle = "#a9d9b4";
    ctx.fillText("press start / space", canvas.width / 2, 200);
    ctx.font = "9px 'Courier New', monospace";
    ctx.fillStyle = "#7fae8a";
    ctx.fillText("\u25b2 to jump on landing \u00b7 clear every hoop to unlock the exit", canvas.width / 2, 220);
    ctx.textAlign = "left";
  }

  function drawMessageScreen(title, lines) {
    canvas.width = VIEW_COLS * TILE;
    canvas.height = VIEW_ROWS * TILE;
    ctx.fillStyle = "#0a1f0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#eef7ee";
    ctx.textAlign = "center";
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = "10px 'Courier New', monospace";
    lines.forEach((line, i) => ctx.fillText(line, canvas.width / 2, canvas.height / 2 + 10 + i * 14));
    ctx.textAlign = "left";
  }

  // ---- debug collision overlay -----------------------------------
  // Draws exactly what the collision code actually checks against, not
  // what the sprites look like: red/cyan fill = full solid box (SOLID_TYPES),
  // yellow/orange fill = the triangular solid half of a ramp tile (matches
  // the floor/ceiling formulas in resolveSlopes), magenta outline = hazard.
  // White square = the ball's bounding box used by boxCollides; green
  // circle = the ball's actual visual/rolling radius.
  function drawCollisionDebug() {
    if (!cheat.enabled || !cheat.debug || !level) return;
    const c0 = Math.max(0, Math.floor(camera.x / TILE));
    const c1 = Math.min(level.width - 1, Math.ceil((camera.x + canvas.width) / TILE));
    const r0 = Math.max(0, Math.floor(camera.y / TILE));
    const r1 = Math.min(level.height - 1, Math.ceil((camera.y + canvas.height) / TILE));
    ctx.save();
    ctx.lineWidth = 1;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const def = classifyTile(level.tiles[r][c]);
        const dx = c * TILE - camera.x, dy = r * TILE - camera.y;
        if (THIN_SOLID_BASE_RECT[def.type]) {
          // Hazard/inflater — draw the actual rotated thin rect, not the
          // full tile, so the overlay matches what really collides.
          const r = rotateRectFraction(THIN_SOLID_BASE_RECT[def.type], def.rotation || 0);
          const fill = def.type === "hazard" ? "rgba(255, 0, 200, 0.4)" : "rgba(120, 220, 120, 0.4)";
          const stroke = def.type === "hazard" ? "#ff00c8" : "#78dc78";
          ctx.fillStyle = fill;
          ctx.fillRect(dx + r.x0 * TILE, dy + r.y0 * TILE, (r.x1 - r.x0) * TILE, (r.y1 - r.y0) * TILE);
          ctx.strokeStyle = stroke;
          ctx.strokeRect(dx + r.x0 * TILE + 0.5, dy + r.y0 * TILE + 0.5, (r.x1 - r.x0) * TILE - 1, (r.y1 - r.y0) * TILE - 1);
        } else if (def.type === "hoop") {
          if (!def.big && ball.size === BALL_SIZE_BIG) {
            // Small hoop, thin solid rect because the ball is big and can't fit.
            const br = BIG_BALL_SMALL_HOOP_RECT[def.part];
            ctx.fillStyle = "rgba(255, 150, 255, 0.4)";
            ctx.fillRect(dx + br.x0 * TILE, dy + br.y0 * TILE, (br.x1 - br.x0) * TILE, (br.y1 - br.y0) * TILE);
            ctx.strokeStyle = "#ff96ff";
            ctx.strokeRect(dx + br.x0 * TILE + 0.5, dy + br.y0 * TILE + 0.5, (br.x1 - br.x0) * TILE - 1, (br.y1 - br.y0) * TILE - 1);
          } else {
            const rect = hoopSolidRectAt(def.part, c, r);
            if (rect) {
              ctx.fillStyle = "rgba(150, 255, 255, 0.4)";
              ctx.fillRect(rect.x0 - c * TILE + dx, rect.y0 - r * TILE + dy, rect.x1 - rect.x0, rect.y1 - rect.y0);
              ctx.strokeStyle = "#96ffff";
              ctx.strokeRect(rect.x0 - c * TILE + dx + 0.5, rect.y0 - r * TILE + dy + 0.5, rect.x1 - rect.x0 - 1, rect.y1 - rect.y0 - 1);
            }
          }
        } else if (isSolidTile(def)) {
          ctx.fillStyle = def.type === "bouncy" ? "rgba(0, 220, 255, 0.35)" : "rgba(255, 40, 40, 0.35)";
          ctx.fillRect(dx, dy, TILE, TILE);
          ctx.strokeStyle = def.type === "bouncy" ? "#00dcff" : "#ff2828";
          ctx.strokeRect(dx + 0.5, dy + 0.5, TILE - 1, TILE - 1);
        } else if (def.type === "slopeFloor" || def.type === "slopeCeil") {
          let pts;
          switch (def.transform) {
            case "id":     pts = [[TILE, 0], [TILE, TILE], [0, TILE]]; break;
            case "flipX":  pts = [[0, 0], [TILE, TILE], [0, TILE]]; break;
            case "flipY":  pts = [[0, 0], [TILE, 0], [TILE, TILE]]; break;
            case "rot180": pts = [[0, 0], [TILE, 0], [0, TILE]]; break;
            default: pts = null;
          }
          if (pts) {
            ctx.fillStyle = def.bouncy ? "rgba(0, 220, 255, 0.35)" : (def.type === "slopeCeil" ? "rgba(255, 150, 0, 0.35)" : "rgba(255, 220, 0, 0.35)");
            ctx.beginPath();
            ctx.moveTo(dx + pts[0][0], dy + pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(dx + pts[i][0], dy + pts[i][1]);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = def.bouncy ? "#00dcff" : (def.type === "slopeCeil" ? "#ff9600" : "#ffdc00");
            ctx.stroke();
          }
        }
      }
    }
    ctx.restore();

    const half = ball.size / 2;
    const bx = ball.x - camera.x, by = ball.y - camera.y;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(bx - half + 0.5, by - half + 0.5, ball.size - 1, ball.size - 1);
    ctx.strokeStyle = "#00ff9c";
    ctx.beginPath();
    ctx.arc(bx, by, half, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font = "10px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(10, 20, 12, 0.7)";
    ctx.fillRect(2, 2, 230, lastSlopeDebug || lastHorizBlockDebug ? 82 : 49);
    ctx.fillStyle = "#eef7ee";
    ctx.fillText(`pos ${ball.x.toFixed(1)}, ${ball.y.toFixed(1)}`, 6, 13);
    ctx.fillText(`vel ${ball.vx.toFixed(1)}, ${ball.vy.toFixed(1)}`, 6, 24);
    ctx.fillText(`grounded ${ball.grounded}  bouncy ${ball.groundBouncy}`, 6, 35);
    ctx.fillText(`water ${ball.inWater}`, 6, 46);
    if (lastSlopeDebug) {
      const d = lastSlopeDebug;
      ctx.fillText(`slope r${d.row} c${d.col} ${d.transform} ${d.role}${d.fromFallback ? " (fallback)" : ""}`, 6, 57);
      ctx.fillText(`surfY ${d.surfaceY} overlap ${d.overlap} (touching)`, 6, 68);
    } else {
      ctx.fillText(`slope: no touch this frame`, 6, 57);
    }
    if (lastHorizBlockDebug) {
      const h = lastHorizBlockDebug;
      if (h.kind === "box") {
        const above = slopeDefAt(h.col, h.row - 1);
        ctx.fillText(`BLOCKED box c${h.col} r${h.row} type=${h.tileType} above=${above ? above.type + " " + above.transform : "none"}`, 6, 79);
      } else if (h.kind === "stepup") {
        ctx.fillText(`STEPPED UP c${h.col} r${h.row} need=${h.stepNeeded}`, 6, 79);
      } else {
        ctx.fillText(`BLOCKED diag c${h.col} r${h.row} ${h.transform} d=${h.signedD}`, 6, 79);
      }
    }
    ctx.restore();
  }

  // Small countdown bars for the three timed pickups (antigrav/highjump/
  // speedbox) — stacked in the top-right corner, only shown while active,
  // so it's clear both that a buff is running and roughly how much is left.
  function drawBuffBars() {
    const buffs = [];
    if (ball.gravityTimer > 0) buffs.push({ label: "GRAV", ratio: ball.gravityTimer / ANTIGRAV_TIME, color: "#4fa8ff" });
    if (ball.jumpBoostTimer > 0) buffs.push({ label: "JUMP", ratio: ball.jumpBoostTimer / HIGHJUMP_BOOST_TIME, color: "#ffd24f" });
    if (ball.speedBoostTimer > 0) buffs.push({ label: "SPD", ratio: ball.speedBoostTimer / SPEEDBOOST_TIME, color: "#4fffb0" });
    if (!buffs.length) return;
    const barW = 54, barH = 7, gap = 3;
    let y = 4;
    const x = canvas.width - barW - 4;
    ctx.save();
    ctx.font = "7px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    for (const b of buffs) {
      ctx.fillStyle = "rgba(10, 20, 12, 0.7)";
      ctx.fillRect(x, y, barW, barH);
      ctx.fillStyle = b.color;
      ctx.fillRect(x + 1, y + 1, Math.max(0, (barW - 2) * Math.min(1, b.ratio)), barH - 2);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, barW - 1, barH - 1);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(b.label, x + 2, y + barH - 1.5);
      y += barH + gap;
    }
    ctx.restore();
  }

  function render() {
    if (game.mode === "menu") { drawMenu(); return; }
    if (game.mode === "loading") { drawMessageScreen("LOADING\u2026", ["reading level data"]); return; }
    if (game.mode === "error") { drawMessageScreen("LOAD ERROR", [game.errorMsg, "press start for menu"]); return; }
    if (!level) return;
    drawBackground();
    drawSpikes();
    drawLevel();
    drawBall();
    drawCollisionDebug();
    drawBuffBars();
    if (game.mode === "levelcomplete") {
      drawCenteredPanel(["LEVEL CLEAR!", "score " + game.score, "press start to continue"]);
    } else if (game.mode === "gameover") {
      drawCenteredPanel(["GAME OVER", "score " + game.score, "press start for menu"]);
    }
  }

  // ---- main loop ------------------------------------------------
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    step(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---- cheat panel UI -------------------------------------------------
  const cheatToggleBtn = document.getElementById("cheat-toggle");
  const cheatPanel = document.getElementById("cheat-panel");
  const cheatMasterBox = document.getElementById("cheat-master");
  const cheatNoclipBox = document.getElementById("cheat-noclip");
  const cheatInvincibleBox = document.getElementById("cheat-invincible");
  const cheatDebugBox = document.getElementById("cheat-debug");
  const rowNoclip = document.getElementById("row-noclip");
  const rowInvincible = document.getElementById("row-invincible");
  const rowDebug = document.getElementById("row-debug");
  const levelGrid = document.getElementById("cheat-level-grid");
  const buffAntigravBtn = document.getElementById("cheat-buff-antigrav");
  const buffSpeedBtn = document.getElementById("cheat-buff-speed");
  const buffHighjumpBtn = document.getElementById("cheat-buff-highjump");

  cheatToggleBtn.addEventListener("click", () => {
    cheatPanel.classList.toggle("open");
  });
  document.getElementById("cheat-close").addEventListener("click", () => {
    cheatPanel.classList.remove("open");
  });

  function refreshCheatUI() {
    cheatToggleBtn.classList.toggle("active", cheat.enabled);
    cheatNoclipBox.disabled = !cheat.enabled;
    cheatInvincibleBox.disabled = !cheat.enabled;
    cheatDebugBox.disabled = !cheat.enabled;
    rowNoclip.classList.toggle("disabled", !cheat.enabled);
    rowInvincible.classList.toggle("disabled", !cheat.enabled);
    rowDebug.classList.toggle("disabled", !cheat.enabled);
    const canBuff = cheat.enabled && game.mode === "playing";
    buffAntigravBtn.disabled = !canBuff;
    buffSpeedBtn.disabled = !canBuff;
    buffHighjumpBtn.disabled = !canBuff;
    Array.from(levelGrid.children).forEach((btn, i) => {
      btn.disabled = !cheat.enabled;
      btn.classList.toggle("current", level !== null && game.levelIndex === i);
    });
  }

  cheatMasterBox.addEventListener("change", () => {
    cheat.enabled = cheatMasterBox.checked;
    if (!cheat.enabled) {
      cheat.noclip = false;
      cheat.invincible = false;
      cheat.debug = false;
      cheatNoclipBox.checked = false;
      cheatInvincibleBox.checked = false;
      cheatDebugBox.checked = false;
      document.getElementById("row-freeroam-hint").style.display = "none";
    }
    refreshCheatUI();
  });
  cheatNoclipBox.addEventListener("change", () => {
    cheat.noclip = cheatNoclipBox.checked;
    document.getElementById("row-freeroam-hint").style.display = cheat.noclip ? "block" : "none";
  });
  cheatInvincibleBox.addEventListener("change", () => { cheat.invincible = cheatInvincibleBox.checked; });
  cheatDebugBox.addEventListener("change", () => { cheat.debug = cheatDebugBox.checked; });
  bindHold(document.getElementById("freeroam-down-btn"), () => (input.down = true), () => (input.down = false));

  // Instant-grant buttons — same timers/effects the real pickups apply, for
  // quickly testing buff behavior without hunting down the tile in a level.
  buffAntigravBtn.addEventListener("click", () => {
    if (!cheat.enabled || game.mode !== "playing") return;
    ball.gravityFlipped = !ball.gravityFlipped;
    ball.gravityTimer = ANTIGRAV_TIME;
  });
  buffSpeedBtn.addEventListener("click", () => {
    if (!cheat.enabled || game.mode !== "playing") return;
    ball.speedBoostTimer = SPEEDBOOST_TIME;
  });
  buffHighjumpBtn.addEventListener("click", () => {
    if (!cheat.enabled || game.mode !== "playing") return;
    ball.jumpBoostTimer = HIGHJUMP_BOOST_TIME;
  });

  LEVEL_FILES.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.textContent = "LVL " + (i + 1);
    btn.disabled = true;
    btn.addEventListener("click", () => {
      if (!cheat.enabled) return;
      game.score = level ? game.score : 0;
      game.lives = Math.max(game.lives, 3);
      game.levelIndex = i;
      loadLevel(i);
      refreshCheatUI();
    });
    levelGrid.appendChild(btn);
  });

  refreshCheatUI();

  updateHud();
  requestAnimationFrame(loop);
})();

  </script>
</body>
</html>
