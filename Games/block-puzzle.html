<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Block Puzzle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :focus { outline: none; }
    button, div { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:              #F4F1EA;
      --panel:           #FDFAF4;
      --panel-border:    #DDD8CC;
      --stat-bg:         #EDE9DF;
      --text:            #2C2416;
      --text-muted:      #7A6E5C;
      --text-tip:        #A09484;
      --btn-border:      #C8C2B2;
      --btn-hover:       #EDE9DF;
      --btn-hover-border:#8B7355;
      --accent:          #6B5744;
      --accent-text:     #FDFAF4;
      --board-bg:        #E8E4DA;
      --board-border:    #C4BEB0;
      --cell-bg:         #DDD8CB;
      --modal-overlay:   rgba(44,36,22,0.4);
      --c: 40px;
    }
    body.dark {
      --bg:              #1a1a2e;
      --panel:           #16213e;
      --panel-border:    #2a2a4a;
      --stat-bg:         #0f3460;
      --text:            #e8e8f0;
      --text-muted:      #8888aa;
      --text-tip:        #555577;
      --btn-border:      #3a3a5c;
      --btn-hover:       #2a2a4a;
      --btn-hover-border:#6c6caa;
      --accent:          #4a4aaa;
      --accent-text:     #ffffff;
      --board-bg:        #0d1a2e;
      --board-border:    #1a2a4a;
      --cell-bg:         #162640;
      --modal-overlay:   rgba(0,0,0,0.6);
    }

    html, body { touch-action: none; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem 3rem;
      transition: background 0.2s, color 0.2s;
      user-select: none; -webkit-user-select: none;
    }

    #top-bar {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 620px; margin-bottom: 1.25rem; gap: 8px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--btn-border); background: var(--panel);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: border-color 0.2s, background 0.3s, transform 0.15s;
    }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 19px; height: 19px; }
    #theme-toggle .icon-sun { display: none; }
    #theme-toggle .icon-moon { display: block; }
    body.dark #theme-toggle .icon-sun { display: block; }
    body.dark #theme-toggle .icon-moon { display: none; }

    #bb-panel {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 1.25rem 1.25rem 1rem;
      width: 100%; max-width: 620px;
      display: flex; flex-direction: column; align-items: center;
      transition: background 0.2s, border-color 0.2s;
    }
    #bb-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; gap: 8px; flex-wrap: wrap; width: 100%;
    }
    #bb-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .bb-stat {
      background: var(--stat-bg); border-radius: 8px; padding: 5px 12px;
      font-size: 14px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 5px; transition: background 0.2s;
      font-variant-numeric: tabular-nums;
    }
    .hdr-btn {
      font-size: 13px; padding: 5px 13px; border-radius: 8px;
      border: 1.5px solid var(--btn-border); background: transparent;
      color: var(--text); cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .hdr-btn:hover { background: var(--btn-hover); border-color: var(--btn-hover-border); }

    #bb-status {
      text-align: center; font-size: 15px; font-weight: 600;
      min-height: 22px; margin-bottom: 10px; color: var(--text);
    }

    #board {
      display: grid; gap: 2px; padding: 4px; position: relative;
      background: var(--board-bg); border: 1px solid var(--board-border); border-radius: 8px;
      margin-bottom: 0.75rem; transition: background 0.2s, border-color 0.2s;
    }
    .cell { background: var(--cell-bg); border-radius: 5px; }
    .cell.on { box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.3); }
    .cell.ghost { background: var(--btn-border); }
    .cell.warn { outline: 2px solid var(--text); outline-offset: -2px; }
    .cell.pop { animation: pop .22s ease-in forwards; }
    @keyframes pop { to { transform: scale(.2); opacity: 0; } }

    #tray { display: flex; justify-content: space-around; align-items: center; height: calc(var(--c) * 2.9); }
    .slot { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
    .slot.used { visibility: hidden; }
    .piece { display: grid; gap: 2px; pointer-events: none; transition: transform .12s; }
    .piece i { display: block; border-radius: 5px; }
    .piece i.f { box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.3); }
    #float { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; display: none; }

    #bb-tip { text-align: center; font-size: 12px; color: var(--text-tip); margin-top: 0.5rem; }

    #toast {
      position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 60;
      font-size: 26px; font-weight: 700; color: var(--accent); background: var(--panel);
      border: 1px solid var(--panel-border); border-radius: 12px; padding: 6px 18px;
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #toast.show { animation: toast .9s ease-out; }
    @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0;
      background: var(--modal-overlay); z-index: 100;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 340px;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 16px; font-weight: 700; margin-bottom: 1.25rem; }
    .setting-row { margin-bottom: 1.1rem; }
    .setting-row label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; color: var(--text-muted); margin-bottom: 6px;
    }
    .setting-row label span { font-weight: 600; color: var(--text); }
    .setting-row input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .color-swatch {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      border: 2.5px solid transparent; transition: border-color 0.15s, transform 0.1s; flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected { border-color: var(--text); }
    .setting-divider { border: none; border-top: 1px solid var(--btn-border); margin: 1rem 0; }
    #settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
    #settings-actions button {
      font-size: 13px; padding: 7px 18px; border-radius: 8px;
      border: 1.5px solid var(--btn-border); background: transparent;
      color: var(--text); cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    #settings-actions button:hover { background: var(--btn-hover); }
    #settings-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    #settings-actions button.primary:hover { opacity: 0.85; }

    #leaderboard-box { max-width: 420px; }
    .lb-entry {
      background: var(--stat-bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .lb-rank { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
    .lb-info { flex: 1; min-width: 0; font-size: 12px; color: var(--text-muted); }
    .lb-score { font-size: 20px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .lb-tag {
      background: var(--panel); border: 1px solid var(--btn-border);
      border-radius: 5px; padding: 1px 6px; font-size: 11px; white-space: nowrap;
    }
    .lb-empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 2rem 0; }

    /* Game over */
    #over-box { text-align: center; }
    #over-box .big { font-size: 44px; font-weight: 700; color: var(--accent); margin: 4px 0 12px; }
    #over-box p { font-size: 14px; color: var(--text-muted); }

    @media (max-width: 600px) { h1 { font-size: 1.3rem; } body { padding-top: 1rem; } }
    @media (prefers-reduced-motion: reduce) { .cell.pop, #toast.show { animation-duration: .01s; } }
  </style>
</head>
<body>

<div id="top-bar">
  <h1>🧱 Block Puzzle</h1>
  <div style="display:flex;gap:8px;">
    <button class="icon-btn" id="leaderboard-btn" aria-label="Leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4a2 2 0 0 1-2-2V5h4"/><path d="M18 9h2a2 2 0 0 0 2-2V5h-4"/><path d="M6 2h12v10a6 6 0 0 1-12 0V2z"/><path d="M12 18v4"/><path d="M8 22h8"/>
      </svg>
    </button>
    <button class="icon-btn" id="settings-btn" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="icon-btn" id="theme-toggle" aria-label="Ganti tema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</div>

<div id="bb-panel">
  <div id="bb-header">
    <div id="bb-info">
      <div class="bb-stat">🎯 <span id="score-val">0</span></div>
      <div class="bb-stat">🏆 <span id="best-val">0</span></div>
    </div>
    <button class="hdr-btn" onclick="startGame()">🔄 Ulang</button>
  </div>
  <div id="bb-status">Seret blok ke papan</div>
  <div id="board"></div>
  <div id="tray"></div>
  <p id="bb-tip">Potongan diacak murni, tanpa rigging</p>
</div>

<div id="float"></div>
<div id="toast"></div>

<!-- Settings Modal -->
<div class="modal" id="settings-modal">
  <div class="modal-box" id="settings-box">
    <h2>⚙️ Pengaturan</h2>

    <div class="setting-row">
      <label>Ukuran Grid <span id="grid-label">8×8</span></label>
      <input type="range" id="grid-slider" min="6" max="10" value="8" step="1">
    </div>

    <hr class="setting-divider">

    <div class="setting-row">
      <label>Warna Blok</label>
      <div class="color-row" id="block-colors"></div>
    </div>

    <div class="setting-row">
      <label>Pratinjau Penempatan <span id="ghost-label">Aktif</span></label>
      <button id="ghost-toggle-btn" class="hdr-btn" style="min-width:80px;">👁 Aktif</button>
    </div>

    <hr class="setting-divider">

    <div class="setting-row">
      <label>Suara <span id="sfx-toggle-label">Aktif</span></label>
      <button id="sfx-toggle-btn" class="hdr-btn" style="min-width:80px;">🔊 Aktif</button>
    </div>
    <div class="setting-row" id="sfx-volume-row">
      <label>Volume <span id="sfx-volume-label">80%</span></label>
      <input type="range" id="sfx-volume-slider" min="0" max="100" value="80" step="5">
    </div>

    <div id="settings-actions">
      <button onclick="closeSettings()">Batal</button>
      <button class="primary" onclick="applySettings()">Terapkan</button>
    </div>
  </div>
</div>

<!-- Leaderboard Modal -->
<div class="modal" id="leaderboard-modal">
  <div class="modal-box" id="leaderboard-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
      <h2 style="margin:0;">🏆 Leaderboard</h2>
      <button class="icon-btn" id="lb-close-btn" style="width:32px;height:32px;" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:1rem;">Skor tertinggi per ukuran grid</p>
    <div id="lb-list"></div>
    <div style="margin-top:1.25rem;text-align:right;">
      <button id="lb-clear-btn" style="font-size:12px;padding:5px 12px;border-radius:8px;border:1.5px solid var(--btn-border);background:transparent;color:var(--text-muted);cursor:pointer;font-family:inherit;">🗑 Hapus Semua</button>
    </div>
  </div>
</div>

<!-- Game over -->
<div class="modal" id="over-modal">
  <div class="modal-box" id="over-box">
    <h2>Tidak ada langkah tersisa</h2>
    <p>Skor akhir</p>
    <div class="big" id="final-val">0</div>
    <p id="final-note" style="margin-bottom:1rem;"></p>
    <div id="settings-actions" style="justify-content:center;">
      <button class="primary" onclick="startGame()">Main Lagi</button>
    </div>
  </div>
</div>

<script>
  // ── Sound (synthesized with Web Audio, no files needed) ──
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!cfg.sfxEnabled || cfg.sfxVolume <= 0) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    const v = (vol || 0.3) * cfg.sfxVolume / 100;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  const semi = n => Math.pow(2, n / 12);

  // Recorded sfx from ../Assets/Misc/sfx/ (falls back to synth if a file is missing)
  const SFX_DIR = '../Assets/Misc/sfx/';
  const MAX_COMBO = 14;
  const buffers = {};
  async function loadBuf(key, file) {
    try {
      const res = await fetch(SFX_DIR + file);
      if (!res.ok) return;
      buffers[key] = await audioCtx.decodeAudioData(await res.arrayBuffer());
    } catch (e) {}
  }
  function playBuf(key, rate) {
    const buf = buffers[key];
    if (!buf || !cfg.sfxEnabled || cfg.sfxVolume <= 0) return false;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = buf; src.playbackRate.value = rate || 1; g.gain.value = cfg.sfxVolume / 100;
    src.connect(g); g.connect(audioCtx.destination); src.start();
    return true;
  }
  const PLACE_VARIANTS = 3;
  for (let i = 1; i <= PLACE_VARIANTS; i++) loadBuf('place' + i, 'place_' + i + '.mp3');
  loadBuf('gameover', 'game_over.mp3');
  for (let i = 1; i <= MAX_COMBO; i++) loadBuf('combo' + i, 'clear_combo_' + i + '.mp3');

  function sfxPlace() {
    const ready = [];
    for (let i = 1; i <= PLACE_VARIANTS; i++) if (buffers['place' + i]) ready.push(i);
    const pitch = 0.8 + Math.random() * 0.3;
    if (!ready.length || !playBuf('place' + ready[Math.floor(Math.random() * ready.length)], pitch)) { tone(240, 0.11, 'sine', 0.4, 0, 120); tone(900, 0.03, 'square', 0.08); }
  }
  // streak = consecutive moves that cleared lines: 1, 2, 3 ... capped at 14, resets on a non-clearing move
  function sfxClear(lines, streak) {
    const lvl = Math.min(streak, MAX_COMBO);
    if (playBuf('combo' + lvl)) return;
    const base = 523 * semi(Math.min(streak - 1, 7) * 2);
    [0, 4, 7, 12, 16, 19].slice(0, 3 + Math.min(lines, 3))
      .forEach((n, i) => tone(base * semi(n), 0.16, 'triangle', 0.3, i * 0.065));
  }
  function sfxLose() {
    if (playBuf('gameover')) return;
    [392, 330, 262, 196].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.18, i * 0.16));
  }

  // ── Theme ────────────────────────────────────────────
  let dark = localStorage.getItem('bb_dark') === '1';
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    dark = !dark;
    document.body.classList.toggle('dark', dark);
    localStorage.setItem('bb_dark', dark ? '1' : '0');
  });

  // ── Settings state ───────────────────────────────────
  const PALETTES = [
    { label: 'Warna-warni', colors: ['#e5707e','#e89a4f','#e6c04a','#4fb88a','#4f9fd8','#9b7fe0','#e070b0'] },
    { label: 'Hijau',  colors: ['#3aaa6a'] },
    { label: 'Biru',   colors: ['#3a7acc'] },
    { label: 'Ungu',   colors: ['#8a4acc'] },
    { label: 'Oranye', colors: ['#cc7a2a'] },
    { label: 'Merah',  colors: ['#cc3a3a'] },
    { label: 'Pink',   colors: ['#cc3a88'] },
  ];
  const DEFAULT_CFG = { size: 8, paletteIdx: 0, ghost: true, sfxEnabled: true, sfxVolume: 80 };
  let cfg = { ...DEFAULT_CFG };
  try {
    const saved = JSON.parse(localStorage.getItem('bb_cfg'));
    if (saved) cfg = { ...DEFAULT_CFG, ...saved };
  } catch(e) {}
  let pendingCfg = { ...cfg };

  const colorRow = document.getElementById('block-colors');
  PALETTES.forEach((p, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.title = p.label;
    sw.style.background = p.colors.length > 1
      ? 'conic-gradient(' + p.colors.join(',') + ',' + p.colors[0] + ')'
      : p.colors[0];
    sw.addEventListener('click', () => {
      pendingCfg.paletteIdx = i;
      colorRow.querySelectorAll('.color-swatch').forEach((s, j) => s.classList.toggle('selected', j === i));
    });
    colorRow.appendChild(sw);
  });

  const gridSlider = document.getElementById('grid-slider');
  const sfxVolumeSlider = document.getElementById('sfx-volume-slider');
  gridSlider.addEventListener('input', () => {
    const v = +gridSlider.value;
    document.getElementById('grid-label').textContent = v + '×' + v;
    pendingCfg.size = v;
  });
  sfxVolumeSlider.addEventListener('input', () => {
    pendingCfg.sfxVolume = +sfxVolumeSlider.value;
    document.getElementById('sfx-volume-label').textContent = pendingCfg.sfxVolume + '%';
  });
  function updateSfxUI(on) {
    document.getElementById('sfx-toggle-btn').textContent = on ? '🔊 Aktif' : '🔇 Mati';
    document.getElementById('sfx-toggle-label').textContent = on ? 'Aktif' : 'Mati';
    document.getElementById('sfx-volume-row').style.display = on ? '' : 'none';
  }
  function updateGhostUI(on) {
    document.getElementById('ghost-toggle-btn').textContent = on ? '👁 Aktif' : '🚫 Mati';
    document.getElementById('ghost-label').textContent = on ? 'Aktif' : 'Mati';
  }
  document.getElementById('sfx-toggle-btn').addEventListener('click', () => {
    pendingCfg.sfxEnabled = !pendingCfg.sfxEnabled; updateSfxUI(pendingCfg.sfxEnabled);
  });
  document.getElementById('ghost-toggle-btn').addEventListener('click', () => {
    pendingCfg.ghost = !pendingCfg.ghost; updateGhostUI(pendingCfg.ghost);
  });

  document.getElementById('settings-btn').addEventListener('click', () => {
    pendingCfg = { ...cfg };
    gridSlider.value = cfg.size;
    document.getElementById('grid-label').textContent = cfg.size + '×' + cfg.size;
    colorRow.querySelectorAll('.color-swatch').forEach((s, i) => s.classList.toggle('selected', i === cfg.paletteIdx));
    sfxVolumeSlider.value = cfg.sfxVolume;
    document.getElementById('sfx-volume-label').textContent = cfg.sfxVolume + '%';
    updateSfxUI(cfg.sfxEnabled); updateGhostUI(cfg.ghost);
    document.getElementById('settings-modal').classList.add('open');
  });
  function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
  function applySettings() {
    const sizeChanged = pendingCfg.size !== cfg.size;
    cfg = { ...pendingCfg };
    localStorage.setItem('bb_cfg', JSON.stringify(cfg));
    closeSettings();
    if (sizeChanged) startGame();   // only a new grid size needs a fresh game
  }
  document.getElementById('settings-modal').addEventListener('click', e => {
    if (e.target.id === 'settings-modal') closeSettings();
  });

  // ── Leaderboard (best 10 per grid size) ──────────────
  const RANK_ICONS = ['🥇','🥈','🥉'];
  function loadLB() { try { return JSON.parse(localStorage.getItem('bb_lb')) || {}; } catch(e) { return {}; } }
  function saveLB(lb) { localStorage.setItem('bb_lb', JSON.stringify(lb)); }
  function bestFor(size) { const l = loadLB()['g' + size]; return l && l.length ? l[0].score : 0; }
  function recordScore(size, score) {
    if (score <= 0) return false;
    const lb = loadLB(), k = 'g' + size;
    const list = lb[k] || [];
    const isBest = !list.length || score > list[0].score;
    list.push({ score, date: new Date().toLocaleDateString('id-ID') });
    list.sort((a, b) => b.score - a.score);
    lb[k] = list.slice(0, 10);
    saveLB(lb);
    return isBest;
  }
  function renderLB() {
    const lb = loadLB(), el = document.getElementById('lb-list');
    const rows = [];
    Object.keys(lb).forEach(k => lb[k].forEach(e => rows.push({ ...e, size: +k.slice(1) })));
    rows.sort((a, b) => b.score - a.score);
    if (!rows.length) { el.innerHTML = '<div class="lb-empty">Belum ada skor</div>'; return; }
    el.innerHTML = rows.slice(0, 20).map((r, i) =>
      `<div class="lb-entry"><div class="lb-rank">${RANK_ICONS[i] || (i + 1)}</div>` +
      `<div class="lb-info"><span class="lb-tag">${r.size}×${r.size}</span> ${r.date}</div>` +
      `<div class="lb-score">${r.score}</div></div>`).join('');
  }
  document.getElementById('leaderboard-btn').addEventListener('click', () => {
    renderLB(); document.getElementById('leaderboard-modal').classList.add('open');
  });
  const closeLB = () => document.getElementById('leaderboard-modal').classList.remove('open');
  document.getElementById('lb-close-btn').addEventListener('click', closeLB);
  document.getElementById('leaderboard-modal').addEventListener('click', e => { if (e.target.id === 'leaderboard-modal') closeLB(); });
  document.getElementById('lb-clear-btn').addEventListener('click', () => {
    if (confirm('Hapus semua skor?')) { localStorage.removeItem('bb_lb'); renderLB(); refreshBest(); }
  });

  // ── Shapes (rotations + mirrors generated) ───────────
  const BASE = [
    ['#'], ['##'], ['###'], ['####'], ['#####'],
    ['##','##'], ['###','###','###'], ['###','###'],
    ['#.','##'], ['#..','#..','###'],
    ['###','.#.'], ['#.','##','.#'],
    ['#.','#.','##'], ['##','.#','.#']
  ];
  const rot = s => s[0].split('').map((_, c) => s.map(r => r[c]).reverse().join(''));
  const SHAPES = [], seen = new Set();
  const addShape = s => { const k = s.join('/'); if (!seen.has(k)) { seen.add(k); SHAPES.push(s); } };
  BASE.forEach(b => {
    [b, b.map(r => [...r].reverse().join(''))].forEach(v => {
      let s = v; for (let i = 0; i < 4; i++) { addShape(s); s = rot(s); }
    });
  });
  const cellsOf = s => {
    const out = [];
    s.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') out.push([x, y]); }));
    return out;
  };

  // ── Game state ───────────────────────────────────────
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), trayEl = $('tray'), floatEl = $('float');
  let N = 8, cells = [], grid, pieces, score, streak, busy, drag = null, over = false;

  function sizeCells() {
    const avail = Math.min(innerWidth - 32 - 40, 460);
    const c = Math.max(22, Math.floor((avail - 8 - 2 * (N - 1)) / N));
    document.documentElement.style.setProperty('--c', c + 'px');
  }
  const C = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--c'));

  function buildBoard() {
    boardEl.innerHTML = ''; cells = [];
    boardEl.style.gridTemplateColumns = `repeat(${N}, var(--c))`;
    boardEl.style.gridTemplateRows = `repeat(${N}, var(--c))`;
    for (let i = 0; i < N * N; i++) {
      const d = document.createElement('div'); d.className = 'cell';
      boardEl.appendChild(d); cells.push(d);
    }
    $('tray').style.width = (N * C() + 2 * (N - 1) + 8) + 'px';
  }
  function paint() {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const v = grid[y][x], el = cells[y * N + x];
      el.className = 'cell' + (v ? ' on' : '');
      el.style.background = v || '';
    }
  }

  // Pieces are picked uniformly at random. No fit checks, no difficulty tuning.
  function randomPiece() {
    const cols = PALETTES[cfg.paletteIdx].colors;
    return {
      shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
      color: cols[Math.floor(Math.random() * cols.length)],
      used: false
    };
  }
  function buildPiece(p, px) {
    const w = p.shape[0].length, h = p.shape.length;
    const el = document.createElement('div'); el.className = 'piece';
    el.style.gridTemplateColumns = `repeat(${w},${px}px)`;
    el.style.gridTemplateRows = `repeat(${h},${px}px)`;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = document.createElement('i');
      i.style.width = i.style.height = px + 'px';
      if (p.shape[y][x] === '#') { i.style.background = p.color; i.className = 'f'; }
      el.appendChild(i);
    }
    return el;
  }
  function renderTray() {
    trayEl.innerHTML = '';
    const boardW = N * C() + 2 * (N - 1) + 8;
    const small = Math.max(12, Math.floor(Math.min(C() * 0.62, (boardW / 3 - 10) / 5.2)));
    pieces.forEach((p, idx) => {
      const slot = document.createElement('div'); slot.className = 'slot' + (p.used ? ' used' : '');
      slot.appendChild(buildPiece(p, small));
      slot.addEventListener('pointerdown', e => startDrag(e, idx, slot));
      trayEl.appendChild(slot);
    });
  }
  function newRound() { pieces = [randomPiece(), randomPiece(), randomPiece()]; renderTray(); }

  function fits(shape, ox, oy) {
    for (const [x, y] of cellsOf(shape)) {
      const gx = ox + x, gy = oy + y;
      if (gx < 0 || gy < 0 || gx >= N || gy >= N || grid[gy][gx]) return false;
    }
    return true;
  }
  function canPlaceAnywhere(shape) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (fits(shape, x, y)) return true;
    return false;
  }
  function findLines(extra) {
    const g = grid.map(r => r.slice());
    if (extra) extra.forEach(([x, y]) => g[y][x] = 1);
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      if (g[i].every(v => v)) rows.push(i);
      if (g.every(r => r[i])) cols.push(i);
    }
    return { rows, cols };
  }

  // ── Dragging ─────────────────────────────────────────
  function startDrag(e, idx, slot) {
    if (busy || over || pieces[idx].used) return;
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const p = pieces[idx], c = C();
    floatEl.innerHTML = '';
    floatEl.appendChild(buildPiece(p, c));
    floatEl.style.display = 'block';
    slot.querySelector('.piece').style.transform = 'scale(.8)';
    drag = { idx, p, w: p.shape[0].length, h: p.shape.length, slot, gx: null, gy: null };
    moveDrag(e);
  }
  function moveDrag(e) {
    if (!drag) return;
    const c = C(), lift = e.pointerType === 'mouse' ? 20 : 70;
    const x = e.clientX - drag.w * c / 2, y = e.clientY - drag.h * c - lift;
    floatEl.style.transform = `translate(${x}px,${y}px)`;
    const r = boardEl.getBoundingClientRect();
    const gx = Math.round((x - r.left - 4) / (c + 2)), gy = Math.round((y - r.top - 4) / (c + 2));
    clearGhost();
    if (fits(drag.p.shape, gx, gy)) {
      drag.gx = gx; drag.gy = gy;
      if (cfg.ghost) {
        const pts = cellsOf(drag.p.shape).map(([a, b]) => [gx + a, gy + b]);
        pts.forEach(([a, b]) => cells[b * N + a].classList.add('ghost'));
        const L = findLines(pts);
        L.rows.forEach(r => { for (let i = 0; i < N; i++) cells[r * N + i].classList.add('warn'); });
        L.cols.forEach(cl => { for (let i = 0; i < N; i++) cells[i * N + cl].classList.add('warn'); });
      }
    } else { drag.gx = drag.gy = null; }
  }
  function clearGhost() { cells.forEach(el => el.classList.remove('ghost', 'warn')); }
  function endDrag() {
    if (!drag) return;
    const d = drag; drag = null;
    floatEl.style.display = 'none';
    clearGhost();
    d.slot.querySelector('.piece').style.transform = '';
    if (d.gx !== null) place(d.idx, d.gx, d.gy);
  }
  addEventListener('pointermove', moveDrag);
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);

  // ── Place, clear, score ──────────────────────────────
  function place(idx, gx, gy) {
    const p = pieces[idx];
    const pts = cellsOf(p.shape);
    pts.forEach(([a, b]) => grid[gy + b][gx + a] = p.color);
    p.used = true;
    trayEl.children[idx].classList.add('used');   // hide before a new wave can replace the slots
    let gain = pts.length;
    const { rows, cols } = findLines();
    const n = rows.length + cols.length;
    paint();
    if (n) {
      streak++;
      gain += 10 * n * n + (streak > 1 ? 10 * streak : 0);
      busy = true;
      const set = new Set();
      rows.forEach(r => { for (let i = 0; i < N; i++) set.add(r * N + i); });
      cols.forEach(c => { for (let i = 0; i < N; i++) set.add(i * N + c); });
      set.forEach(i => cells[i].classList.add('pop'));
      toast(n > 1 ? `${n} garis!` : (streak > 1 ? `Beruntun ×${streak}` : 'Bersih!'));
      sfxClear(n, streak);
      setTimeout(() => {
        set.forEach(i => { grid[Math.floor(i / N)][i % N] = 0; });
        paint(); busy = false; afterMove();
      }, 230);
    } else {
      streak = 0;
      sfxPlace();
      afterMove();
    }
    addScore(gain);
  }
  function addScore(n) {
    score += n; $('score-val').textContent = score;
    if (score > +$('best-val').textContent) $('best-val').textContent = score;
  }
  function afterMove() {
    if (pieces.every(p => p.used)) newRound();
    const left = pieces.filter(p => !p.used);
    if (left.length && !left.some(p => canPlaceAnywhere(p.shape))) gameOver();
  }
  function toast(t) {
    const el = $('toast'); el.textContent = t;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }
  function refreshBest() { $('best-val').textContent = Math.max(bestFor(N), score || 0); }
  function gameOver() {
    over = true;
    const isBest = recordScore(N, score);
    sfxLose();
    $('final-val').textContent = score;
    $('final-note').textContent = isBest ? '🏆 Skor tertinggi baru!' : '';
    $('bb-status').textContent = 'Permainan selesai';
    $('over-modal').classList.add('open');
  }
  function startGame() {
    $('over-modal').classList.remove('open');
    N = cfg.size;
    sizeCells(); buildBoard();
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    score = 0; streak = 0; busy = false; over = false;
    $('score-val').textContent = 0;
    $('bb-status').textContent = 'Seret blok ke papan';
    refreshBest();
    paint(); newRound();
  }
  addEventListener('resize', () => {
    sizeCells(); buildBoard(); if (grid) { paint(); renderTray(); }
  });
  startGame();
</script>
</body>
</html>
